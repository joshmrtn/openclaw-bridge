site_name: openclaw-bridge
site_description: Bridge OpenClaw and SillyTavern so AI companion characters maintain a single identity across all communication channels.
site_url: https://joshmrtn.github.io/openclaw-bridge
repo_url: https://github.com/joshmrtn/openclaw-bridge
repo_name: joshmrtn/openclaw-bridge
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Getting started: getting-started.md
  - Adding a character: adding-a-character.md
  - Security: oc-security.md
  - Development: development.md
  - Docker E2E testing: docker-e2e.md
  - Troubleshooting: troubleshooting.md
