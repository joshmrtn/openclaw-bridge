name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build extension bundle
        run: npm run build:extension

      - name: Verify committed bundle is up to date
        run: git diff --exit-code st-extension/index.js

      - name: Run unit tests
        run: OPENCLAW_BRIDGE_ENABLE_HEADLESS=false npm test -- --forceExit

  e2e-fast:
    name: E2E fast tier
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: docker/setup-buildx-action@v3

      - name: Build fast-tier images
        run: docker compose -f docker/docker-compose.yml build
        env:
          DOCKER_BUILDKIT: 1

      - name: Run fast-tier E2E
        run: npm run test:e2e:fast

  e2e-browser:
    name: E2E browser tier
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: docker/setup-buildx-action@v3

      - name: Build browser-tier images
        run: docker compose -f docker/docker-compose.yml build
        env:
          DOCKER_BUILDKIT: 1

      - name: Run browser-tier E2E
        run: npm run test:e2e:browser

  macos-compat:
    name: macOS compatibility
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Shell script syntax check
        run: bash -n setup.sh update.sh uninstall.sh dev-setup.sh scripts/link-character.sh scripts/verify.sh migrations/0001_baseline.sh

      - name: Shell script smoke tests
        run: |
          bash setup.sh --help
          bash update.sh --help
          bash update.sh --skip-pull --skip-st --skip-oc --yes || true

      - name: Build extension bundle
        run: npm run build:extension

      - name: Verify committed bundle is up to date
        run: git diff --exit-code st-extension/index.js

      - name: Unit tests
        run: OPENCLAW_BRIDGE_ENABLE_HEADLESS=false npm test -- --forceExit
